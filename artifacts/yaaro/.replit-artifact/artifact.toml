kind = "mobile"
previewPath = "/"
title = "Yaaro"
description = "A modern mobile social app demo with local mock authentication, 24-hour status stories, one-to-one chat, editable profiles, and a polished dark mode experience for testing on a phone."
version = "1.0.0"
id = "artifacts/yaaro"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24428

[services.development]
run = "pnpm --filter @workspace/yaaro run build && pnpm --filter @workspace/yaaro run serve"

[services.production]
build = [ "pnpm", "--filter", "@workspace/yaaro", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/yaaro", "run", "serve" ]

[services.env]
PORT = "24428"
BASE_PATH = "/"